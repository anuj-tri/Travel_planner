<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Travel Planner-Reset Password</title>
    <link rel="stylesheet" href="reset-password.css" />
  </head>
  <body>
    <div class="reset_password-page">
      <div class="reset-password">
        <h1><strong>Resest Your Password</strong></h1>
        <p>Enter your new password below.</p>
        <form (ngSubmit)="resetPassword()">
          <label><strong>New Password:</strong></label>
          <input
            type="password"
            name="newPassword"
            [(ngModel)]="newPassword"
            placeholder="Enter your new password:..."
          /><br /><br />

          <label><strong>Confirm New Password:</strong></label>
          <input
            type="password"
            name="confirmpassword"
            [(ngModel)]="confirmPassword"
            placeholder="Re-enter your new password:..."
          /><br /><br />

          <button class="reset-btn" type="submit">Reset Password</button><br /><br />

          <a href="" (click)="goToLogin(); $event.preventDefault()">Back to Login page</a>

          <p *ngIf="message" class="success-message">{{ message }}</p>

          <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
        </form>
      </div>
    </div>
  </body>
</html>
