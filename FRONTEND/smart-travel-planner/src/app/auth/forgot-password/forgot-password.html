<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Trvel Planner_ForgotPassword</title>
    <link rel="stylesheet" href="forgot-password.css" />
  </head>
  <body>
    <div class="forgot_password-page">
      <div class="forgot_password-box">
        <h1><strong>Forgot Password?</strong></h1>
        <p>Enter your email adressa and we'll send you<br />instruction to reset your password.</p>

        <form (ngSubmit)="sendResetLink()">
          <label><strong>Email:</strong></label>
          <input
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="Enter your regis. email address..."
            required
          /><br /><br />

          <button class="Sendresetlink-btn" type="Submit">Send Reset Link</button><br /><br />

          <a href="" (click)="goToLogin(); $event.preventDefault()">Back to Login page</a>

          <p *ngIf="message" class="sucess-message">{{ message }}</p>

          <p *ngIf="errorMessage" class="error-Message">{{ errorMessage }}</p>
        </form>
      </div>
    </div>
  </body>
</html>
