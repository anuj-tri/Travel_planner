<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><Trip Dashboard></title>
  </head>
  <body>
    <div
      class="trip-dashboard"
      [class.sidebar-collapsed]="isSidebarCollapsed"
      [class.mobile-menu-open]="isMobileMenuOpen"
    >
      <header class="top-header">
        <button
          type="button"
          class="menu-toggle"
          (click)="toggleSidebar()"
          [attr.aria-label]="isMobileMenuOpen ? 'Close navigation menu' : 'Toggle navigation menu'"
          [attr.aria-expanded]="isMobileMenuOpen"
        >
          ☰
        </button>
        <div class="website-name">
          <h2>SMART TRAVEL PLANNER</h2>
        </div>

        <div class="user-info">
          <span class="user-icon">◉</span>
          <span>{{ firstName }} {{ lastName }}</span>
        </div>

      </header>

      <!--Mobile Backdrop -->
      <button
        type="button"
        class="sidebar-backdrop"
        aria-label="Close navigation menu"
        (click)="closeMobileMenu()"
        tabindex="-1"
      ></button>

      <!-- Left Sidebar -->
      <aside class="sidebar">

        <div class="sidebar-menu top-menu">

          <a
            routerLink="/trip-dashboard/create-new-trip"
            routerLinkActive="active-link"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMobileMenu()"
          >
            <span class="menu-icon">✈︎</span>
            <span class="menu-label">CREATE NEW TRIP</span>
          </a>

          <a
            routerLink="/trip-dashboard/saved-trips"
            routerLinkActive="active-link"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMobileMenu()"
          >
            <span class="menu-icon">☰</span>
            <span class="menu-label">SAVED TRIP</span>
          </a>

          <a
            routerLink="/trip-dashboard/modify-trip"
            routerLinkActive="active-link"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMobileMenu()"
          >
            <span class="menu-icon">✎</span>
            <span class="menu-label">MODIFY TRIP</span>
          </a>

        </div>

        <div class="sidebar-menu bottom-menu">

          <a
            routerLink="/trip-dashboard/profile"
            routerLinkActive="active-link"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMobileMenu()"
          >
            <span class="menu-icon">◉</span>
            <span class="menu-label">PROFILE</span>
          </a>

          <button
            class="logout-button"
            type="button"
            (click)="logout()"
          >
            <span class="menu-icon">⏻</span>
            <span class="menu-label">LOGOUT</span>
          </button>

        </div>

      </aside>
      <!--Dynamic Page Content-->
      <div class="main-content">
        <router-outlet></router-outlet>
      </div>
    </div>
  </body>
</html>
